name: Update PKGBUILD

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-pkgbuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream APT repository
        id: check
        run: python3 .github/scripts/update.py

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.updated == 'true'
        run: |
          docker run --rm -v "$PWD:/pkg:ro" archlinux:base-devel \
            bash -c 'useradd -m builder && install -Dm644 -o builder -g builder /pkg/PKGBUILD /home/builder/PKGBUILD && su -s /bin/bash builder -c "cd /home/builder && makepkg --printsrcinfo"' > .SRCINFO
          grep -q "^[[:space:]]*pkgver = ${{ steps.check.outputs.pkgver }}$" .SRCINFO

      - name: Commit and push update
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${{ steps.check.outputs.pkgver }}-${{ steps.check.outputs.pkgrel }}"
            git push
          fi
